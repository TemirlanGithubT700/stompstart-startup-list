name: Render AIR logo

on:
  push:
    branches:
      - add-air-security

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-air-security
      - name: Render official AIR SVG as PNG
        shell: bash
        run: |
          mkdir -p startups/air-security
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          import urllib.request
          import cairosvg
          from PIL import Image

          url = "https://cdn.prod.website-files.com/6a1557357aace3d4dbe73ca3/6a68bef16a03353f6d5e553f_logo_off-white.svg"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              svg = response.read()

          rendered = cairosvg.svg2png(bytestring=svg, output_width=512)
          logo = Image.open(io.BytesIO(rendered)).convert("RGBA")
          if logo.height > 512:
              scale = 512 / logo.height
              logo = logo.resize((round(logo.width * scale), 512), Image.Resampling.LANCZOS)

          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          x = (512 - logo.width) // 2
          y = (512 - logo.height) // 2
          canvas.alpha_composite(logo, (x, y))
          canvas.save("startups/air-security/logo.png", optimize=True)
          print("saved", canvas.size, "from rendered logo", logo.size)
          PY
      - name: Commit logo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startups/air-security/logo.png
          git commit -m "Add official AIR Security logo" || exit 0
          git push origin HEAD:add-air-security
